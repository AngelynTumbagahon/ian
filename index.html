<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Boyfriend ❤️</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffe6eb;
            background-image: radial-gradient(#ffccd5 20%, transparent 20%), radial-gradient(#ffccd5 20%, transparent 20%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }
        .container {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 35px 40px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(255, 105, 180, 0.3);
            max-width: 420px;
            width: 90%;
            position: relative;
            border: 4px solid #ffb3c1;
        }
        h1 {
            color: #d11a5b;
            font-size: 26px;
            margin-bottom: 25px;
            line-height: 1.4;
            font-weight: 800;
        }
        .emoji-avatar {
            width: 130px;
            height: 130px;
            background-color: #ffd166;
            border-radius: 50%;
            margin: 0 auto 25px;
            position: relative;
            box-shadow: inset -10px -10px 0 rgba(0,0,0,0.1), 0 8px 20px rgba(255, 209, 102, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }
        /* Default cute face setup */
        .face {
            width: 100%;
            height: 100%;
            position: relative;
        }
        .eyes {
            display: flex;
            justify-content: space-between;
            width: 60px;
            position: absolute;
            top: 45px;
            left: 35px;
            transition: all 0.2s ease;
        }
        .eye {
            width: 14px;
            height: 14px;
            background-color: #333;
            border-radius: 50%;
        }
        .mouth {
            width: 30px;
            height: 15px;
            border-bottom: 4px solid #333;
            border-radius: 0 0 15px 15px;
            position: absolute;
            bottom: 45px;
            left: 50px;
            transition: all 0.2s ease;
        }
        .blush {
            display: flex;
            justify-content: space-between;
            width: 90px;
            position: absolute;
            top: 55px;
            left: 20px;
        }
        .cheek {
            width: 18px;
            height: 10px;
            background-color: #ff85a1;
            border-radius: 50%;
            opacity: 0.6;
        }
        /* Gigil Angry State */
        .gigil .emoji-avatar {
            background-color: #ff6b6b;
            box-shadow: inset -10px -10px 0 rgba(0,0,0,0.1), 0 8px 25px rgba(255, 107, 107, 0.6);
            transform: scale(1.05);
        }
        .gigil .eye {
            height: 6px;
            border-radius: 2px;
            transform: rotate(15px);
            background-color: #fff;
        }
        .gigil .eyes .eye:first-child { transform: rotate(25deg); }
        .gigil .eyes .eye:last-child { transform: rotate(-25deg); }
        .gigil .mouth {
            width: 40px;
            height: 12px;
            background-color: #fff;
            border: 3px solid #333;
            border-radius: 6px;
            bottom: 40px;
            left: 42px;
        }
        /* Success State */
        .love .emoji-avatar {
            background-color: #ff477e;
            box-shadow: inset -10px -10px 0 rgba(0,0,0,0.1), 0 8px 25px rgba(255, 71, 126, 0.6);
        }
        .love .eyes { top: 40px; }
        .love .eye {
            background: none;
            width: 16px;
            height: 16px;
            position: relative;
        }
        .love .eye::before, .love .eye::after {
            content: "";
            position: absolute;
            top: 0;
            width: 10px;
            height: 16px;
            background: #fff;
            border-radius: 10px 10px 0 0;
        }
        .love .eye::before { left: 10px; transform: rotate(-45deg); transform-origin: 0 100%; }
        .love .eye::after { left: 0; transform: rotate(45deg); transform-origin: 100% 100%; }
        .love .mouth {
            width: 34px;
            height: 17px;
            background-color: #fff;
            border: none;
            border-radius: 0 0 17px 17px;
            bottom: 40px;
            left: 48px;
        }

        /* Buttons Styling */
        .buttons {
            display: flex;
            justify-content: center;
            gap: 25px;
            height: 60px;
            align-items: center;
            position: relative;
            margin-top: 20px;
        }
        button {
            padding: 14px 32px;
            font-size: 18px;
            font-weight: 800;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.1s ease, background-color 0.2s;
        }
        #yesBtn {
            background-color: #ff4d6d;
            color: white;
        }
        #yesBtn:hover {
            background-color: #ff758f;
            transform: scale(1.1);
        }
        #noBtn {
            background-color: #6c757d;
            color: white;
            position: absolute;
            transition: all 0.15s ease-out;
        }
        .hidden {
            display: none;
        }
        .success-text {
            color: #d11a5b;
            font-size: 28px;
            font-weight: 800;
            line-height: 1.5;
            margin: 10px 0;
        }
        .warning-text {
            color: #ff3333;
            font-size: 16px;
            margin-top: 25px;
            font-weight: bold;
            min-height: 24px;
            background-color: #ffeef2;
            padding: 8px;
            border-radius: 10px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .warning-text.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <!-- Main Quiz View -->
        <div id="quizScreen">
            <div class="emoji-avatar">
                <div class="face">
                    <div class="blush">
                        <div class="cheek"></div>
                        <div class="cheek"></div>
                    </div>
                    <div class="eyes">
                        <div class="eye"></div>
                        <div class="eye"></div>
                    </div>
                    <div class="mouth"></div>
                </div>
            </div>
            
            <h1>Will you extend being my boyfriend for 2 months?</h1>
            
            <div class="buttons">
                <button id="yesBtn">YES</button>
                <button id="noBtn">NO</button>
            </div>
            <div id="warningMsg" class="warning-text"></div>
        </div>

        <!-- Success View -->
        <div id="successScreen" class="hidden">
            <p class="success-text">Buti naman, wala kang magagawa! ❤️</p>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const quizScreen = document.getElementById('quizScreen');
        const successScreen = document.getElementById('successScreen');
        const warningMsg = document.getElementById('warningMsg');
        const mainContainer = document.getElementById('mainContainer');

        // Set layout baseline positions for the 'No' button
        resetNoButton();

        function resetNoButton() {
            noBtn.style.left = '145px';
            noBtn.style.top = '6px';
        }

        function triggerGigil() {
            // Update Text
            warningMsg.innerText = "Ayusin mo sagot, gigil mo ako 😤";
            warningMsg.classList.add('show');
            
            // Transform avatar into the custom angry/gigil state dynamically
            mainContainer.classList.remove('love');
            mainContainer.classList.add('gigil');

            // Fly button randomly around the safe screenspace
            const padding = 40;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;
            
            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        // Run away behaviors
        noBtn.addEventListener('mouseover', triggerGigil);
        noBtn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            triggerGigil();
        });
        noBtn.addEventListener('click', function(e) {
            e.preventDefault();
            triggerGigil();
        });

        // Click Yes to complete the form
        yesBtn.addEventListener('click', () => {
            mainContainer.classList.remove('gigil');
            mainContainer.classList.add('love');
            
            quizScreen.classList.add('hidden');
            successScreen.classList.remove('hidden');
        });
    </script>
</body>
</html>
