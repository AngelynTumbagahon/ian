<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will you?</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffeef2;
            background-image: radial-gradient(#ffccd5 20%, transparent 20%);
            background-size: 20px 20px;
            overflow: hidden;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 350px;
        }
        .emoji {
            font-size: 60px;
            margin-bottom: 20px;
        }
        h1 {
            color: #d63384;
            font-size: 24px;
            margin: 0 0 40px 0;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            position: relative;
            width: 100%;
            height: 60px;
        }
        button {
            padding: 12px 35px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
        }
        #yesBtn {
            background-color: #e91e63;
            color: white;
        }
        #yesBtn:hover {
            transform: scale(1.05);
            background-color: #c2185b;
        }
        #noBtn {
            background-color: #6c757d;
            color: white;
            z-index: 10;
        }
        .hidden {
            display: none !important;
        }
        .success-message {
            color: #d63384;
            font-size: 28px;
            font-weight: bold;
            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes pop {
            0% { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container" id="quizContainer">
        <!-- You can replace this text emoji with an <img> tag if you prefer -->
        <div class="emoji">😊</div> 
        <h1 id="question">Would you still be willing to be my boyfriend?</h1>
        <div class="buttons">
            <button id="yesBtn">YES</button>
            <button id="noBtn">NO</button>
        </div>
    </div>

    <div class="container hidden" id="successContainer">
        <div class="emoji">🥰</div>
        <div class="success-message">
            Buti naman wala kang magagawa 😜
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
